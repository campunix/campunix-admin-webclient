<div class="flex flex-col flex-auto min-w-0">
    <!-- Main -->
    <div class="flex flex-col flex-auto items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-4xl">
            <!-- Title -->
            <div class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight">
                Change Your Password
            </div>

            <!-- Form -->
            <div class="mt-8 sm:mt-12 p-6 pb-7 sm:p-10 sm:pb-7 shadow rounded-2xl bg-card">
                <form
                    class="space-y-3"
                    [formGroup]="changePasswordForm"
                    #changePasswordNgForm="ngForm">

                    <!-- Current Password -->
                    <mat-form-field class="w-full">
                        <mat-label>Current Password</mat-label>
                        <input
                            matInput
                            [type]="'password'"
                            [formControlName]="'currentPassword'"
                            required>
                        <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>

                    <!-- New Password -->
                    <mat-form-field class="w-full">
                        <mat-label>New Password</mat-label>
                        <input
                            matInput
                            [type]="'password'"
                            [formControlName]="'password'"
                            required>
                        <mat-error *ngIf="changePasswordForm.get('password')?.hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>

                    <!-- Confirm New Password -->
                    <mat-form-field class="w-full">
                        <mat-label>Confirm New Password</mat-label>
                        <input
                            matInput
                            [type]="'password'"
                            [formControlName]="'passwordConfirm'"
                            required>
                        <mat-error *ngIf="changePasswordForm.get('passwordConfirm')?.hasError('required')">
                            Required
                        </mat-error>
                        <mat-error *ngIf="changePasswordForm.hasError('mustMatch')">
                            Passwords must match
                        </mat-error>
                    </mat-form-field>

                    <!-- Actions -->
                    <div class="flex items-center justify-end">
                        <button
                            mat-button
                            [color]="'accent'"
                            [disabled]="changePasswordForm.pristine || changePasswordForm.untouched"
                            (click)="clearForm()">
                            Clear
                        </button>
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="changePasswordForm.invalid || changePasswordForm.disabled"
                            (click)="changePassword()">
                            Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
