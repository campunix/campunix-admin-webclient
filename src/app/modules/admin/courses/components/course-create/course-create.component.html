<div class="flex flex-col flex-auto min-w-0">

    <!-- Main -->
    <div class="flex flex-col flex-auto items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-4xl">
            <div class="-ml-4">
                <a
                    mat-button
                    [routerLink]="['/courses/list']"
                    [color]="'primary'">
                    <mat-icon [svgIcon]="'heroicons_outline:arrow-long-left'"></mat-icon>
                    <span class="ml-2">Back to Courses</span>
                </a>
            </div>
            <div class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight">
                Create Courses
            </div>
            <!-- Form -->
            <div class="mt-8 sm:mt-12 p-6 pb-7 sm:p-10 sm:pb-7 shadow rounded-2xl bg-card">
                <!-- Alert -->
                <fuse-alert
                    class="mb-8"
                    *ngIf="alert"
                    [type]="alert.type"
                    [showIcon]="false">
                    {{ alert.message }}
                </fuse-alert>
                <form
                    class="space-y-3"
                    [formGroup]="courseForm"
                    #supportNgForm="ngForm">
                    <!-- Title -->
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            [formControlName]="'title'"
                            [required]="true">
                        <mat-label>Course Title</mat-label>
                        <mat-error *ngIf="courseForm.get('title').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>
                    <!-- Code -->
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            [formControlName]="'code'"
                            [required]="true">
                        <mat-label>Course Code</mat-label>
                        <mat-error *ngIf="courseForm.get('code').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>
                    <!-- department -->
                    <mat-form-field class="w-full">
                        <mat-label>Department</mat-label>
                        <mat-select
                            [formControlName]="'department_id'"
                            [required]="true">
                            @for (dept of departments; track dept) {
                                <mat-option [value]="dept.id">{{dept.name}}</mat-option>
                            }
                        </mat-select>
                        <mat-error *ngIf="courseForm.get('department_id').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>

                    <!-- course type -->
                    <mat-form-field class="w-full">
                        <mat-label>Course Type</mat-label>
                        <mat-select
                            [formControlName]="'course_type'"
                            [required]="true">
                            @for (courseType of courseTypes; track courseType) {
                                <mat-option [value]="courseType">{{courseType}}</mat-option>
                            }
                        </mat-select>
                        <mat-error *ngIf="courseForm.get('course_type').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>
                    <!-- Actions -->
                    <div class="flex items-center justify-end">
                        <button
                            mat-button
                            [color]="'accent'"
                            [disabled]="courseForm.pristine || courseForm.untouched"
                            (click)="clearForm()">
                            Clear
                        </button>
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="courseForm.pristine || courseForm.invalid"
                            (click)="createCourse()">
                            Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
