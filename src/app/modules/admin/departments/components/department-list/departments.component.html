<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div
            class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Departments</div>
        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Search -->
            <mat-form-field
                class="fuse-mat-dense fuse-mat-rounded min-w-64"
                [subscriptSizing]="'dynamic'">
                <mat-icon
                    class="icon-size-5"
                    matPrefix
                    [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    [autocomplete]="'off'"
                    [placeholder]="'Search departments'">
            </mat-form-field>
            <!-- Add department button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="createDepartment()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">

        <!-- Departments list -->
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
            <ng-container *ngIf="departments as departments">
                <ng-container *ngIf="departments.length > 0 && !isLoading; else noDepartments">
                    <div class="grid">
                        <!-- Header -->
                        <div
                            class="inventory-grid z-10 sticky top-0 grid grid-cols-3 gap-4 py-4 px-6 md:px-8 shadow text-md font-semibold text-secondary bg-gray-50 dark:bg-black dark:bg-opacity-5"
                            matSort
                            matSortDisableClear>
                            <div [mat-sort-header]="'departmentName'">Name</div>
                            <div
                                class="hidden sm:block"
                                [mat-sort-header]="'departmentCode'">
                                Code
                            </div>
                            <div>
                                Action
                            </div>
                        </div>
                        <!-- Rows -->
                        <ng-container *ngIf="departments as departments">
                            <ng-container *ngFor="let department of departments; trackBy: trackByFn">
                                <div
                                    class="inventory-grid grid grid-cols-3 items-center gap-4 py-3 px-6 md:px-8 border-b">

                                    <!-- Name (clickable for edit) -->
                                    <div class="truncate">
                                        <a [routerLink]="['/departments/edit', department.id]" class="hover:underline text-primary">
                                            {{ department.name }}
                                        </a>
                                    </div>

                                    <!-- Code -->
                                    <div class="hidden sm:block">
                                        {{ department.code }}
                                    </div>

                                    <div>
                                        <button
                                            (click)="editDepartment(department.id)"
                                            mat-icon-button
                                            [matTooltip]="'Edit'"
                                            class="mr-2">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button
                                            (click)="deleteDepartment(department.id)"
                                            mat-icon-button
                                            [matTooltip]="'Delete'">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>

                                </div>

                            </ng-container>
                        </ng-container>
                    </div>

                    <mat-paginator
                        class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                        [ngClass]="{'pointer-events-none': isLoading}"
                        [length]="pagination.totalItems"
                        [pageIndex]="pagination.currentPage"
                        [pageSize]="pagination.pageSize"
                        [pageSizeOptions]="[5, 10, 25, 100]"
                        [showFirstLastButtons]="true"
                        (page)="onPageChange($event)">
                    </mat-paginator>

                </ng-container>
            </ng-container>

            <ng-template #noDepartments>
                <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">There are no
                    Departments!
                </div>
            </ng-template>

        </div>

    </div>

</div>
