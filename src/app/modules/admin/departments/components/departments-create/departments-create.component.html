<div class="flex flex-col flex-auto min-w-0">

    <!-- Main -->
    <div class="flex flex-col flex-auto items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-4xl">
            <div class="-ml-4 sm:mt-8">
                <a
                    mat-button
                    [routerLink]="['/departments/list']"
                    [color]="'primary'">
                    <mat-icon [svgIcon]="'heroicons_outline:arrow-long-left'"></mat-icon>
                    <span class="ml-2">Back to Department</span>
                </a>
            </div>
            <div class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight">
                {{ isEditMode ? 'Edit Department' : 'Create Departments' }}
            </div>
            <!-- Form -->
            <div class="mt-8 sm:mt-12 p-6 pb-7 sm:p-10 sm:pb-7 shadow rounded-2xl bg-card">
                <!-- Alert -->
                <fuse-alert
                    class="mb-8"
                    *ngIf="alert"
                    [type]="alert.type"
                    [showIcon]="false">
                    {{ alert.message }}
                </fuse-alert>
                <form
                    class="space-y-3"
                    [formGroup]="departmentForm"
                    #departmentNgForm="ngForm">
                    <!-- Name -->
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            [formControlName]="'name'"
                            [required]="true">
                        <mat-label>Name</mat-label>
                        <mat-error *ngIf="departmentForm.get('name').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>
                    <!-- Code -->
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            [formControlName]="'code'"
                            [required]="true">
                        <mat-label>Code</mat-label>
                        <mat-error *ngIf="departmentForm.get('code').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>

                    <!-- Organizations -->
                    <mat-form-field class="w-full">
                        <mat-label>Organization</mat-label>
                        <mat-select
                            [formControlName]="'organization_id'"
                            [required]="true">
                            @for (organization of organizations; track organization) {
                                <mat-option [value]="organization.id">{{ organization.name }}</mat-option>
                            }
                        </mat-select>
                        <mat-error *ngIf="departmentForm.get('organization_id').hasError('required')">
                            Required
                        </mat-error>
                    </mat-form-field>

                    <!-- Actions -->
                    <div class="flex items-center justify-end">
                        <button
                            mat-button
                            [color]="'accent'"
                            [disabled]="departmentForm.pristine || departmentForm.untouched"
                            (click)="clearForm()">
                            Clear
                        </button>
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="departmentForm.pristine || departmentForm.invalid"
                            (click)="saveDepartment()">
                            {{ isEditMode ? 'Update' : 'Submit' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
