<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div
            class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Preferences</div>
        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Search -->
            <mat-form-field
                class="fuse-mat-dense fuse-mat-rounded min-w-64"
                [subscriptSizing]="'dynamic'">
                <mat-icon
                    class="icon-size-5"
                    matPrefix
                    [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    [autocomplete]="'off'"
                    [placeholder]="'Search Preferences'">
            </mat-form-field>
            <!-- Add Preference button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="createPreference()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">

        <!-- Preference list -->
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
            <ng-container *ngIf="preferences as preferences">
                <ng-container *ngIf="preferences.length > 0 && !isLoading; else noPreferences">
                    <div class="grid">
                        <!-- Header -->
                        <div
                            class="inventory-grid z-10 sticky top-0 grid grid-cols-5 gap-6 py-4 px-8 md:px-12 shadow text-md font-semibold text-secondary bg-gray-50 dark:bg-black dark:bg-opacity-5"
                            matSort
                            matSortDisableClear>
                            <div class="col-span-2" [mat-sort-header]="'name'">Teachers Name</div>
                            <div
                                class="hidden sm:block"
                                [mat-sort-header]="'day'">
                                Day
                            </div>
                            <div class="hidden sm:block">
                                Slot
                            </div>
                            <div>
                                Action
                            </div>
                        </div>
                        <!-- Rows -->
                        <ng-container *ngIf="preferences as preferences">
                            <ng-container *ngFor="let preference of preferences; trackBy: trackByFn">
                                <div
                                    class="inventory-grid grid grid-cols-5 items-center gap-4 py-3 px-6 md:px-8 border-b w-full">

                                    <!-- Teacher Name -->
                                    <div class="truncate col-span-2">
                                        {{ preference.teacher_name }}
                                    </div>

                                    <!-- Day -->
                                    <div class="hidden sm:block">
                                        {{ preference.day ? preference.day : 'Any' }}
                                    </div>

                                    <!-- Slot No -->
                                    <div class="hidden sm:block">
                                        {{ preference.slot_no }}
                                    </div>

                                    <div class="flex flex-row gap-2">
                                        <button (click)="editPreference(preference.id)" mat-icon-button>
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button (click)="deletePreference(preference.id)" mat-icon-button>
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>

                                </div>

                            </ng-container>
                        </ng-container>
                    </div>

                    <mat-paginator
                        class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                        [ngClass]="{'pointer-events-none': isLoading}"
                        [length]="pagination.totalItems"
                        [pageIndex]="pagination.currentPage"
                        [pageSize]="pagination.pageSize"
                        [pageSizeOptions]="[5, 10, 25, 100]"
                        [showFirstLastButtons]="true"
                        (page)="onPageChange($event)">
                    </mat-paginator>

                </ng-container>
            </ng-container>

            <ng-template #noPreferences>
                <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">There are no Preference!
                </div>
            </ng-template>

        </div>

    </div>

</div>
