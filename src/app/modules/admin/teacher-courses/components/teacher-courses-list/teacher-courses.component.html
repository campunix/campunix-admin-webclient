<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>

        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Course Teachers</div>

        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    autocomplete="off"
                    placeholder="Search teacher courses"/>
            </mat-form-field>

            <button class="ml-4" mat-flat-button color="primary" (click)="createTeacherCourses()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
            <ng-container *ngIf="teacherCourses">
                <ng-container *ngIf="teacherCourses.length > 0 && !isLoading; else noTeacherCourses">
                    <div class="grid">

                        <!-- Table Header -->
                        <div
                            class="inventory-grid z-10 sticky top-0 grid grid-cols-4 gap-4 py-4 px-6 md:px-8 shadow text-md font-semibold text-secondary bg-gray-50 dark:bg-black dark:bg-opacity-5"
                            matSort matSortDisableClear>
                            <div>Course Title</div>
                            <div>Course Code</div>
                            <div>Teachers</div>
                            <div>Action</div>
                        </div>

                        <!-- Table Rows -->
                        <ng-container *ngFor="let item of teacherCourses; trackBy: trackByFn">
                            <div class="inventory-grid grid grid-cols-4 items-center gap-4 py-3 px-6 md:px-8 border-b">

                                <!-- Course Title -->
                                <div class="truncate">
                                    {{ item.course.title }}
                                </div>

                                <!-- Course Code -->
                                <div class="hidden sm:block">
                                    {{ item.course.code }}
                                </div>

                                <!-- Teacher Names (multiple lines) -->
                                <div>
                                    <ng-container *ngFor="let teacher of item.course.course_teachers; let last = last">
                                        <div style="padding: 4px 0; border-bottom: 1px solid #ccc;" [style.border-bottom]="last ? 'none' : '1px solid #ccc'">
                                            {{ teacher.full_name }}
                                        </div>
                                    </ng-container>
                                </div>

                                <!-- Action -->
                                <div>
                                    <button (click)="deleteTeacherCourses(item.id)" mat-icon-button>
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </div>

                            </div>
                        </ng-container>
                    </div>

                    <!-- Pagination -->
                    <mat-paginator
                        class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                        [ngClass]="{'pointer-events-none': isLoading}"
                        [length]="pagination.totalItems"
                        [pageIndex]="pagination.currentPage"
                        [pageSize]="pagination.pageSize"
                        [pageSizeOptions]="[5, 10, 25, 100]"
                        [showFirstLastButtons]="true"
                        (page)="onPageChange($event)">
                    </mat-paginator>

                </ng-container>
            </ng-container>

            <!-- Empty state -->
            <ng-template #noTeacherCourses>
                <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">
                    There are no Teacher Courses!
                </div>
            </ng-template>
        </div>
    </div>
</div>
