<div class="flex flex-col flex-auto min-w-0">
    
    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div
            class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <!-- Title -->

        <div>
            <div class="-ml-4">
                <a
                    mat-button
                    [routerLink]="['/routine/class/list']"
                    [color]="'primary'">
                    <mat-icon [svgIcon]="'heroicons_outline:arrow-long-left'"></mat-icon>
                    <span class="ml-2">Back to class routines</span>
                </a>
            </div>
            <div class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight">
                {{routineData?.title}}
            </div>
        </div>

        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Add Preference button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="downloadPDF()">
                <span class="ml-2 mr-1">Download</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-col flex-auto items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-6xl">
            <!-- Form -->
            <div #pdfContent id="pdfContent" class="p-6 pb-7 sm:p-10 sm:pb-7 shadow rounded-2xl bg-card">
                <div class="flex flex-auto overflow-y-auto p-4">
                    <div *ngIf="genes?.length > 0 else noRoutine" class="schedule-container">
                        <!-- Time Header Row -->
                        <div class="schedule-row">
                            <div class="day-header"></div>
                            <div class="time-header">10:00 - 11:00</div>
                            <div class="time-header">11:00 - 12:00</div>
                            <div class="time-header">12:00 - 1:00</div>
                            <div class="time-header">2:00 - 3:00</div>
                            <div class="time-header">3:00 - 4:00</div>
                        </div>
                    
                        <div *ngFor="let day of weekDays; index as i" class="schedule-row">
                            <div class="day-semester-side-header">
                                <div class="day-side-header">{{day}}</div>
                                <div class="semester-side-header">
                                    <div *ngFor="let semester of semesters; index as j" class="schedule-slot-row">
                                        <div class="semester-cell">{{semester.year}}-{{semester.number}}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="schedule-slot-container">
                                <div *ngFor="let semester of semesters; index as j" class="schedule-slot-row">
                                    <app-class-routine-cell
                                        *ngFor="let slot of slots; index as k;"
                                        [dayNumber]="i"
                                        [semesterNumber]="j"
                                        [slotNumber]="k"
                                        [totalSemesters]="semesters.length"
                                        [totalSlots]="slots.length"
                                        [genes]="genes">
                                    </app-class-routine-cell>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- No courses -->
                    <ng-template #noRoutine>
                        <div class="flex flex-auto flex-col items-center justify-center">
                            <mat-icon
                                class="icon-size-24"
                                [svgIcon]="'heroicons_outline:document-search'"></mat-icon>
                            <div class="mt-6 text-2xl font-semibold tracking-tight text-secondary">No routine found!</div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
