<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div
            class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-y-auto p-4">
        <div class="schedule-container">
            <!-- Time Header Row -->
            <div class="schedule-row">
                <div class="day-header"></div>
                <div class="time-header">10:00 - 11:00</div>
                <div class="time-header">11:00 - 12:00</div>
                <div class="time-header">12:00 - 1:00</div>
                <div class="time-header">2:00 - 3:00</div>
                <div class="time-header">3:00 - 4:00</div>
            </div>
        
            <div *ngFor="let day of weekDays; index as i" class="schedule-row">
                <div class="day-semester-side-header">
                    <div class="day-side-header">{{day}}</div>
                    <div class="semester-side-header">
                        <div *ngFor="let semester of semesters; index as j" class="schedule-slot-row">
                            <div class="semester-cell">{{semester.year}}-{{semester.number}}</div>
                        </div>
                    </div>
                </div>

                <div class="schedule-slot-container">
                    <div *ngFor="let semester of semesters; index as j" class="schedule-slot-row">
                        <!-- <div *ngFor="let slot of slots; index as k;" class="schedule-cell">
                            {{getGeneByCellNumber(i,j,k)?.course_code}} - {{getGeneByCellNumber(i,j,k)?.course_teacher}}
                        </div> -->
                        <app-routine-cell
                            *ngFor="let slot of slots; index as k;"
                            [dayNumber]="i"
                            [semesterNumber]="j"
                            [slotNumber]="k"
                            [totalSemesters]="semesters.length"
                            [totalSlots]="slots.length"
                            [genes]="genes">
                        </app-routine-cell>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
