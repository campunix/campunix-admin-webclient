<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div
            class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <!-- Title -->

        <div>
            <div class="-ml-4">
                <a
                    mat-button
                    [routerLink]="['/routine/exam/list']"
                    [color]="'primary'">
                    <mat-icon [svgIcon]="'heroicons_outline:arrow-long-left'"></mat-icon>
                    <span class="ml-2">Back to class routines</span>
                </a>
            </div>
            <div class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight">
                {{routineData?.title}}
            </div>
        </div>

        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Add Preference button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="downloadPDF()">
                <span class="ml-2 mr-1">Download</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-col flex-auto items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-6xl">
            <!-- Form -->
            <div #pdfContent class="exam-routine-container mt-8 sm:mt-12 p-6 pb-7 sm:p-10 sm:pb-7 shadow rounded-2xl bg-card">
                
                <table class="min-w-full divide-y border mt-6">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-3 text-left">Date</th>
                            <th class="px-4 py-3 text-left">Course</th>
                            <th class="px-4 py-3 text-left">Teacher</th>
                            <th class="px-4 py-3 text-left">Time Slot</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr *ngFor="let entry of routineData?.exam_routine?.routineRows; let i = index">
                            <td class="px-4 py-2">
                                <span>{{entry.date| date: 'dd/MM/yyyy'}}</span>
                            </td>
                            <td class="px-4 py-2">
                                <span>{{entry.course?.title}}</span>
                            </td>
                            <td class="px-4 py-2">
                                <div class="flex flex-wrap gap-2">
                                    <ul>
                                        <li *ngFor="let teacher of entry.teachers">
                                            {{teacher.name}}
                                        </li>
                                    </ul>
                                </div>
                            </td>
                            <td class="px-4 py-2">
                                <span>{{entry.timeSlot}}</span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div *ngIf="routineData?.description" class="w-full mt-4">
                    <div><span>{{routineData?.description}}</span></div>
                </div>
            </div>
        </div>
    </div>
</div>
